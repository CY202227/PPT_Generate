name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[llm,mcp,documents,dev]"
      - run: python -m ruff check ppt_generate tests tools start_demo.py
      - run: python -m ruff format --check ppt_generate tests tools start_demo.py
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/check_dist.py
      - run: python -m venv .wheel-test
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.wheel-test/Scripts/python.exe
          else
            PYTHON=.wheel-test/bin/python
          fi
          "$PYTHON" -m pip install dist/*.whl
          "$PYTHON" -I tools/wheel_smoke.py
